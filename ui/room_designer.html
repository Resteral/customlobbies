<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clandestine Lab Designer & Fixture Engineering</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    .designer-panel {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #10b981;
      border-radius: 16px;
      width: 950px;
      height: 620px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(90deg, #064e3b, #0f172a);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(16, 185, 129, 0.3);
    }
    .title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      flex: 1;
      overflow: hidden;
    }
    .catalog {
      padding: 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .fixture-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .fixture-card:hover {
      border-color: #10b981;
      transform: translateY(-2px);
    }
    .card-name {
      font-weight: 700;
      color: #f1f5f9;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .card-cat {
      font-size: 0.75rem;
      color: #10b981;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .btn-install {
      background: #059669;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-install:hover { background: #047857; }
    .status-sidebar {
      background: rgba(15, 23, 42, 0.98);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .status-box {
      background: rgba(30, 41, 59, 0.6);
      border-radius: 8px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .status-title {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .status-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .warning-text {
      color: #f59e0b;
      font-size: 0.75rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="designer-panel">
    <div class="header">
      <div class="title">🧪 IN-HOUSE LAB & GROW ROOM DESIGNER</div>
      <button onclick="closeUI()" style="background:#ef4444;color:white;border:none;padding:6px 14px;border-radius:6px;font-weight:bold;cursor:pointer;">✕ Close (F7)</button>
    </div>

    <div class="main-grid">
      <div class="catalog" id="fixtureList">
        <!-- Fixtures populated via JavaScript -->
      </div>

      <div class="status-sidebar">
        <h3 style="font-size:0.9rem;color:#f8fafc;border-bottom:1px solid #334155;padding-bottom:6px;">🏠 Stashhouse Telemetry</h3>
        
        <div class="status-box">
          <div class="status-title">⚡ Power Load</div>
          <div class="status-value" id="powerDisplay">4.2 / 18.0 kW</div>
          <div class="warning-text">⚠️ High spikes trigger utility alerts</div>
        </div>

        <div class="status-box">
          <div class="status-title">🌬️ Odor Mitigation</div>
          <div class="status-value" style="color:#10b981;" id="odorDisplay">88% Masked</div>
          <div class="warning-text" style="color:#94a3b8;">Carbon scrubbers online</div>
        </div>

        <div class="status-box">
          <div class="status-title">🚨 Police Thermal Heat</div>
          <div class="status-value" style="color:#22c55e;" id="heatDisplay">LOW (4%)</div>
        </div>

        <button onclick="alert('All installed fixtures saved to property persistent storage!')" style="background:#3b82f6;color:white;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:auto;">💾 Save Room Layout</button>
      </div>
    </div>
  </div>

  <script>
    const catalog = [
      {
        id: 'mylar_tent',
        name: 'Mylar Reflective Hydro Grow Tent',
        category: 'Botany',
        desc: '+25% cannabis yield & blocks infrared thermal scanning from police helicopters.',
        cost: 450
      },
      {
        id: 'carbon_filter',
        name: 'Inline 8-Inch Carbon Scrubber',
        category: 'Ventilation',
        desc: 'Eliminates 88% of organic terpenes and chemical smell leaking out windows.',
        cost: 650
      },
      {
        id: 'fume_hood',
        name: 'Lab Bio-Chemical Fume Hood',
        category: 'Chemistry',
        desc: 'Traps toxic phosphine gas & methylamine vapors during meth synthesis.',
        cost: 2400
      },
      {
        id: 'circuit_breaker',
        name: '50-Amp Dual Power Sub-Panel',
        category: 'Electrical',
        desc: 'Upgrades house electrical grid by +25 kW to prevent blown fuses & fires.',
        cost: 1800
      },
      {
        id: 'dehumidifier',
        name: 'Commercial Digital Dehumidifier',
        category: 'Climate',
        desc: 'Maintains optimal 45% RH to eliminate bud rot & mold loss on harvest.',
        cost: 750
      },
      {
        id: 'stash_safe',
        name: 'Concealed False-Wall Stash Safe',
        category: 'Security',
        desc: '24-slot hidden safe concealed behind false walling to protect cash/drugs.',
        cost: 3200
      }
    ];

    function renderCatalog() {
      const container = document.getElementById('fixtureList');
      container.innerHTML = '';
      catalog.forEach(item => {
        const card = document.createElement('div');
        card.className = 'fixture-card';
        card.innerHTML = `
          <div>
            <div class="card-cat">${item.category}</div>
            <div class="card-name">${item.name}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <button class="btn-install" onclick="installFixture('${item.id}')">Install ($${item.cost})</button>
        `;
        container.appendChild(card);
      });
    }

    function installFixture(type) {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('installFixtureInProperty', {
          propertyId: 'prop_suburb_stash',
          fixtureType: type
        }).then(res => {
          alert(res.message);
        });
      } else {
        const item = catalog.find(c => c.id === type);
        alert(`Installed ${item.name}!`);
      }
    }

    function closeUI() {
      if (typeof Helix !== 'undefined' && Helix.emit) {
        Helix.emit('CloseHousingUI');
      }
    }

    renderCatalog();
  </script>
</body>
</html>
