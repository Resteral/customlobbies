<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynasty 8 Pacifica - Real Estate & Stashhouses</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    .tablet {
      background: #0f172a;
      border: 2px solid #3b82f6;
      border-radius: 20px;
      width: 900px;
      height: 600px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #60a5fa;
      letter-spacing: 1px;
    }
    .logo span { color: #f59e0b; }
    .nav-tabs { display: flex; gap: 12px; }
    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #3b82f6;
      color: #fff;
      border-color: #60a5fa;
    }
    .content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      border-color: #3b82f6;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .district-badge {
      display: inline-block;
      font-size: 0.75rem;
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .specs {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .specs strong { color: #f1f5f9; }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
    }
    .btn-rent { background: #22c55e; color: #fff; }
    .btn-rent:hover { background: #16a34a; }
    .btn-buy { background: #3b82f6; color: #fff; }
    .btn-buy:hover { background: #2563eb; }
    .btn-lock { background: #f59e0b; color: #000; }
    .btn-lock:hover { background: #d97706; }
    .status-badge {
      font-size: 0.75rem;
      font-weight: bold;
      color: #4ade80;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="tablet">
    <div class="header">
      <div class="logo">DYNASTY <span>8</span> PACIFICA</div>
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="loadListings()">All Listings</button>
        <button class="tab-btn" onclick="filterMyProperties()">My Safehouses</button>
      </div>
      <button class="tab-btn" style="background:#ef4444;color:white;" onclick="closeUI()">✕ Exit</button>
    </div>

    <div class="content" id="propertyList">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <script>
    const sampleProperties = [
      {
        id: 'prop_motel_104',
        name: 'Skidrow Motel Room #104',
        district: 'Industrial Docks',
        rentPrice: 75,
        buyPrice: null,
        maxPowerKW: 4.5,
        currentPowerKW: 1.2,
        smellInsulation: 25,
        isRented: false,
        isOwned: false
      },
      {
        id: 'prop_suburb_stash',
        name: 'Vinewood Suburb Stash House',
        district: 'Outskirts Hills',
        rentPrice: 350,
        buyPrice: 280000,
        maxPowerKW: 18.0,
        currentPowerKW: 3.5,
        smellInsulation: 60,
        isRented: false,
        isOwned: false
      },
      {
        id: 'prop_downtown_penthouse',
        name: 'Skyline Heights Penthouse 42B',
        district: 'Downtown Financial',
        rentPrice: 950,
        buyPrice: 1250000,
        maxPowerKW: 35.0,
        currentPowerKW: 0,
        smellInsulation: 85,
        isRented: false,
        isOwned: false
      },
      {
        id: 'prop_docks_warehouse_c',
        name: 'Pier 14 Industrial Warehouse C',
        district: 'Industrial Docks',
        rentPrice: 600,
        buyPrice: 650000,
        maxPowerKW: 75.0,
        currentPowerKW: 0,
        smellInsulation: 40,
        isRented: false,
        isOwned: false
      }
    ];

    let currentProps = [...sampleProperties];

    function renderProperties(list) {
      const container = document.getElementById('propertyList');
      container.innerHTML = '';
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-title">${p.name}</div>
            <div class="district-badge">${p.district}</div>
            <div class="specs">
              ⚡ Power Grid Limit: <strong>${p.maxPowerKW} kW</strong><br>
              🌬️ Odor Masking: <strong>${p.smellInsulation}%</strong><br>
              💵 Rent: <strong>$${p.rentPrice}/hr</strong> ${p.buyPrice ? `| Buy: <strong>$${p.buyPrice.toLocaleString()}</strong>` : ''}
            </div>
          </div>
          <div class="btn-row">
            ${p.isOwned || p.isRented ? `
              <button class="action-btn btn-lock" onclick="toggleLock('${p.id}')">🔐 Toggle Door Lock</button>
            ` : `
              <button class="action-btn btn-rent" onclick="rentProp('${p.id}')">Rent ($${p.rentPrice}/hr)</button>
              ${p.buyPrice ? `<button class="action-btn btn-buy" onclick="buyProp('${p.id}')">Buy ($${p.buyPrice.toLocaleString()})</button>` : ''}
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function rentProp(id) {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('rentProperty', { propertyId: id }).then(res => {
          alert(res.message);
          loadListings();
        });
      } else {
        const item = currentProps.find(p => p.id === id);
        if (item) { item.isRented = true; renderProperties(currentProps); alert('Rented ' + item.name); }
      }
    }

    function buyProp(id) {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('buyProperty', { propertyId: id }).then(res => {
          alert(res.message);
          loadListings();
        });
      } else {
        const item = currentProps.find(p => p.id === id);
        if (item) { item.isOwned = true; renderProperties(currentProps); alert('Purchased ' + item.name); }
      }
    }

    function toggleLock(id) {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('togglePropertyDoor', { propertyId: id }).then(res => alert(res.message));
      } else {
        alert('Door lock state toggled.');
      }
    }

    function loadListings() {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('getPropertiesList').then(res => {
          if (res && res.properties) { currentProps = res.properties; renderProperties(currentProps); }
        });
      } else {
        renderProperties(currentProps);
      }
    }

    function filterMyProperties() {
      renderProperties(currentProps.filter(p => p.isOwned || p.isRented));
    }

    function closeUI() {
      if (typeof Helix !== 'undefined' && Helix.emit) {
        Helix.emit('CloseHousingUI');
      }
    }

    loadListings();
  </script>
</body>
</html>
