<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CustomLobbies Desktop Streamer Program</title>
  <style>
    body {
      background: #0a0c10;
      color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 2rem;
    }
    .card {
      background: #12161f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #00f2fe, #9d4edd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }
    .btn {
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      width: 100%;
      margin-top: 1rem;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
      border: 1px solid #00f2fe;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎥 CustomLobbies Desktop Screen & Audio Capturer</h1>
    <p>Broadcast high-FPS gameplay screen capture and system audio directly to CustomLobbies.com</p>

    <button class="btn" id="btnStartCapture">Select Display / Window Source</button>
    <video id="localPreview" autoplay muted></video>
    <div id="status" style="margin-top: 1rem; color: #00e676; font-weight: 600;">Status: Ready</div>
  </div>

  <script>
    let ws = new WebSocket('ws://localhost:8088');

    document.getElementById('btnStartCapture').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 60 },
          audio: true
        });
        document.getElementById('localPreview').srcObject = stream;
        document.getElementById('status').textContent = 'Status: Live Stream Broadcasting via WebSocket Bridge!';
      } catch(err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
