<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pacifica Gang Territory & Turf Wars</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    .turf-modal {
      background: #090d16;
      border: 2px solid #3b82f6;
      border-radius: 16px;
      width: 960px;
      height: 620px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(90deg, #1e3a8a, #090d16);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
    }
    .title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .turf-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }
    .turf-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .turf-card:hover {
      border-color: #60a5fa;
    }
    .turf-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .gang-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      color: white;
    }
    .perks {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .perks strong { color: #f1f5f9; }
    .btn-capture {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-capture:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="turf-modal">
    <div class="header">
      <div class="title">🚩 PACIFICA GANG TERRITORY & TURF CONQUEST</div>
      <button onclick="closeUI()" style="background:#ef4444;color:white;border:none;padding:6px 14px;border-radius:6px;font-weight:bold;cursor:pointer;">✕ Close (F8)</button>
    </div>

    <div class="turf-grid" id="turfList">
      <!-- Populated via JavaScript -->
    </div>
  </div>

  <script>
    const turfs = [
      {
        id: 'downtown_finance',
        name: 'Downtown Financial Hub',
        gang: 'Syndicate 8',
        color: '#3b82f6',
        tax: 4500,
        perk: '+30% Money Laundering Rate & Luxury Contraband Client Demand'
      },
      {
        id: 'industrial_docks',
        name: 'Pacific Maritime Docks',
        gang: 'Harbor Cartel',
        color: '#10b981',
        tax: 6200,
        perk: '+50% Maritime Export Payouts & -25% Chemical Precursor Bulk Costs'
      },
      {
        id: 'neon_strip',
        name: 'Neon Boulevard & Nightclubs',
        gang: 'Viper Triad',
        color: '#ec4899',
        tax: 5100,
        perk: '+40% Nightclub Ecstasy/Coke/Weed Sales Volume & Fast Dealer Cooldowns'
      },
      {
        id: 'outskirts_badlands',
        name: 'Outskirts Desert Badlands',
        gang: 'Ghost Nomads',
        color: '#f59e0b',
        tax: 2800,
        perk: '0% Police Helicopter Surveillance & Open Sandbox Compound Building'
      }
    ];

    function renderTurfs() {
      const container = document.getElementById('turfList');
      container.innerHTML = '';
      turfs.forEach(t => {
        const card = document.createElement('div');
        card.className = 'turf-card';
        card.innerHTML = `
          <div>
            <div class="turf-name">${t.name}</div>
            <div class="gang-badge" style="background:${t.color};">CONTROLLING GANG: ${t.gang}</div>
            <div class="perks">
              💰 Protection Dividend: <strong>$${t.tax.toLocaleString()}/hr</strong><br>
              🌟 District Perk: <strong>${t.perk}</strong>
            </div>
          </div>
          <button class="btn-capture" onclick="captureZone('${t.id}')">🏴 Claim / Spray Graffiti Tag</button>
        `;
        container.appendChild(card);
      });
    }

    function captureZone(id) {
      const gName = prompt('Enter your Gang / Crew Name to claim this territory:', 'My Syndicate');
      if (gName) {
        if (typeof Helix !== 'undefined' && Helix.call) {
          Helix.call('captureTurfPoint', { districtId: id, gangName: gName }).then(res => alert(res.message));
        } else {
          const item = turfs.find(t => t.id === id);
          if (item) { item.gang = gName; renderTurfs(); alert(`Zone captured! ${item.name} is now under ${gName} control.`); }
        }
      }
    }

    function closeUI() {
      if (typeof Helix !== 'undefined' && Helix.emit) {
        Helix.emit('CloseCustomUI');
      }
    }

    renderTurfs();
  </script>
</body>
</html>
