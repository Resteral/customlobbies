<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smuggling Fleet Garage & Stash Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    .garage-modal {
      background: #0b1120;
      border: 2px solid #06b6d4;
      border-radius: 16px;
      width: 1020px;
      height: 660px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(90deg, #0e7490, #0b1120);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(6, 182, 212, 0.3);
    }
    .title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #22d3ee;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }
    .veh-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .veh-card:hover {
      border-color: #22d3ee;
    }
    .veh-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(6, 182, 212, 0.2);
      color: #67e8f9;
      margin-bottom: 12px;
    }
    .specs {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .specs strong { color: #f1f5f9; }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      min-width: 110px;
    }
    .btn-spawn { background: #0891b2; color: #fff; }
    .btn-spawn:hover { background: #0e7490; }
    .btn-stash { background: #475569; color: #fff; }
    .btn-stash:hover { background: #334155; }
    .btn-tow { background: #ea580c; color: #fff; }
    .btn-tow:hover { background: #c2410c; }
    .btn-scrap { background: #dc2626; color: #fff; }
    .btn-scrap:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="garage-modal">
    <div class="header">
      <div class="title">🚗 SMUGGLING FLEET, TOW TRUCK & STASH GARAGE</div>
      <button onclick="closeUI()" style="background:#ef4444;color:white;border:none;padding:6px 14px;border-radius:6px;font-weight:bold;cursor:pointer;">✕ Close (F9)</button>
    </div>

    <div class="grid" id="vehList">
      <!-- Populated via JavaScript -->
    </div>
  </div>

  <script>
    const vehicles = [
      {
        id: 'truck_heavy_tow',
        name: 'Brute Flatbed Heavy Hydraulic Tow Truck',
        category: 'Heavy Recovery & Impound Hauler',
        speed: 160,
        armor: 90,
        stashKg: 650,
        canineResistance: '80% (Lockbox + Flatbed)',
        isTowTruck: true,
        price: 125000
      },
      {
        id: 'car_stash_muscle',
        name: 'Vapid Dominator GT (Stash Edition)',
        category: 'Land Muscle Car',
        speed: 240,
        armor: 65,
        stashKg: 85,
        canineResistance: '95% (Sub-Floor)',
        price: 95000
      },
      {
        id: 'boat_smuggler',
        name: 'Tropic Offshore Twin-Turbo Speedboat',
        category: 'Maritime Export Vessel',
        speed: 180,
        armor: 40,
        stashKg: 500,
        canineResistance: '100% (Maritime)',
        price: 145000
      },
      {
        id: 'rv_cooker',
        name: 'Fleetwood Bounder RV (Mobile Lab)',
        category: 'Clandestine Mobile Lab',
        speed: 130,
        armor: 50,
        stashKg: 250,
        canineResistance: '40%',
        price: 65000
      },
      {
        id: 'police_interceptor',
        name: 'Pacifica Police Interceptor Cruiser',
        category: 'Law Enforcement',
        speed: 260,
        armor: 85,
        stashKg: 0,
        canineResistance: 'N/A (Equipped with Radar Scanner)',
        price: 110000
      }
    ];

    function renderVehicles() {
      const container = document.getElementById('vehList');
      container.innerHTML = '';
      vehicles.forEach(v => {
        const card = document.createElement('div');
        card.className = 'veh-card';
        card.innerHTML = `
          <div>
            <div class="veh-name">${v.name}</div>
            <div class="category-badge">${v.category}</div>
            <div class="specs">
              🏎️ Top Speed: <strong>${v.speed} km/h</strong> | Armor: <strong>${v.armor}%</strong><br>
              📦 Cargo / Stash Capacity: <strong>${v.stashKg} kg</strong><br>
              🐕 Police K9 Resistance: <strong>${v.canineResistance}</strong><br>
              💵 Price: <strong>$${v.price.toLocaleString()}</strong>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn-action btn-spawn" onclick="spawnVehicle('${v.id}')">Spawn Vehicle</button>
            <button class="btn-action btn-stash" onclick="openStash('${v.id}')">Open Stash</button>
            ${v.isTowTruck ? `
              <button class="btn-action btn-tow" onclick="hookTow()">🪝 Hook Target</button>
              <button class="btn-action btn-tow" style="background:#475569;" onclick="releaseTow()">🔓 Release</button>
              <button class="btn-action btn-scrap" onclick="scrapTow()">💥 Scrap & Crush</button>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function spawnVehicle(id) {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('spawnSmugglingVehicle', { vehicleId: id }).then(res => alert(res.message));
      } else {
        const v = vehicles.find(item => item.id === id);
        alert(`Delivered ${v.name}!`);
      }
    }

    function openStash(id) {
      const item = prompt('Enter contraband item to conceal (e.g., Heisenberg Blue, Weed, Coke, Tungsten Ores):', 'Heisenberg Blue');
      if (item) {
        alert(`Concealed 5x ${item} in false floor / flatbed lockbox compartment.`);
      }
    }

    function hookTow() {
      const target = prompt('Enter target vehicle name or nearby license plate to winch onto Flatbed:', 'Rival Syndicate Muscle Car');
      if (target) {
        if (typeof Helix !== 'undefined' && Helix.call) {
          Helix.call('hookVehicleToTowTruck', { towTruckId: 'tow_truck_1', targetVehicleName: target }).then(res => alert(res.message));
        } else {
          alert(`🪝 Winch cable engaged! Loaded [${target}] onto hydraulic flatbed.`);
        }
      }
    }

    function releaseTow() {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('releaseVehicleFromTowTruck', { towTruckId: 'tow_truck_1' }).then(res => alert(res.message));
      } else {
        alert('🔓 Winch detached. Vehicle unloaded from flatbed.');
      }
    }

    function scrapTow() {
      if (typeof Helix !== 'undefined' && Helix.call) {
        Helix.call('salvageScrapTowedVehicle', { towTruckId: 'tow_truck_1' }).then(res => alert(res.message));
      } else {
        alert('💥 Scrapped towed vehicle at Pacifica Scrapyard! Received +$14,500 and 6x refined mineral ingots (Chromium, Titanium, Tungsten).');
      }
    }

    function closeUI() {
      if (typeof Helix !== 'undefined' && Helix.emit) {
        Helix.emit('CloseCustomUI');
      }
    }

    renderVehicles();
  </script>
</body>
</html>
